name: Construir e enviar imagem do Docker de backend

on:
  push:
    branches:
      - master
      - development

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Código de check-out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nest-lab-api
          tags: |
            type=raw,value=developer,enable=${{ github.ref_name == 'development' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Cria e envia a imagem do Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "NODE_ENV=production"
            "PORT=${{ secrets.PORT }}"
            "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}"
            "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            "JWT_TOKEN_ISSUER=${{ secrets.JWT_TOKEN_ISSUER }}"
            "JWT_TTL=${{ secrets.JWT_TTL }}"
            "MAIL_HOST=${{ secrets.MAIL_HOST }}"
            "MAIL_PORT=${{ secrets.MAIL_PORT }}"
            "MAIL_USER=${{ secrets.MAIL_USER }}"
            "MAIL_PASS=${{ secrets.MAIL_PASS }}"
            "MAIL_FROM=${{ secrets.MAIL_FROM }}"
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nest-lab-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nest-lab-api:buildcache,mode=max

